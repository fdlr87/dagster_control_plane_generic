version: "3.8"

x-dagster-common: &dagster-common
  build:
    context: .
    dockerfile: Dockerfile.dagster
  environment: &dagster-env
    DAGSTER_POSTGRES_HOST: dagster-postgres
    DAGSTER_POSTGRES_PORT: "5432"
    DAGSTER_POSTGRES_USER: dagster
    DAGSTER_POSTGRES_PASSWORD: dagster
    DAGSTER_POSTGRES_DB: dagster
    MONGODB_URI: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
    MONGODB_DATABASE: app_db
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_CONNECT_URL: "http://kafka-connect:8083"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_NATIVE_PORT: "9000"
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: clickhouse_pass
    DATASETS_DIR: /opt/dagster/app/datasets
  networks:
    - data-plane-network

services:
  # ─────────────────────────────────────────────
  #  DATA INFRASTRUCTURE
  # ─────────────────────────────────────────────

  mongodb:
    image: mongo:7
    container_name: mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - data-plane-network
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok } catch(e) { 0 }
        " | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo-init:
    image: mongo:7
    container_name: mongo-init
    depends_on:
      mongodb:
        condition: service_started
    entrypoint: >
      bash -c '
        echo "⏳ Waiting for MongoDB to be ready..."
        sleep 5
        echo "🔧 Initiating replica set..."
        mongosh --host mongodb:27017 --eval "
          try {
            rs.status();
            print(\"Replica set already initiated\");
          } catch(e) {
            rs.initiate({
              _id: \"rs0\",
              members: [{ _id: 0, host: \"mongodb:27017\" }]
            });
            print(\"Replica set initiated successfully\");
          }
        "
        echo "✅ MongoDB replica set ready"
      '
    networks:
      - data-plane-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - data-plane-network
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Zookeeper || curl -sf http://localhost:8080/commands/ruok | grep -q ruok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - data-plane-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-connect:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    networks:
      - data-plane-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_pass
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - data-plane-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  #  DAGSTER CONTROL PLANE
  # ─────────────────────────────────────────────

  dagster-postgres:
    image: postgres:16-alpine
    container_name: dagster-postgres
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    ports:
      - "5432:5432"
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data
    networks:
      - data-plane-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
      interval: 5s
      timeout: 3s
      retries: 10

  dagster-user-code:
    <<: *dagster-common
    container_name: dagster-user-code
    command: ["dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-m", "dagster_project"]
    ports:
      - "4000:4000"
    volumes:
      - ./dagster_project:/opt/dagster/app/dagster_project
      - ./datasets:/opt/dagster/app/datasets
    depends_on:
      dagster-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  dagster-webserver:
    <<: *dagster-common
    container_name: dagster-webserver
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "workspace.yaml"]
    ports:
      - "3000:3000"
    volumes:
      - ./dagster_project:/opt/dagster/app/dagster_project
      - ./datasets:/opt/dagster/app/datasets
    depends_on:
      dagster-user-code:
        condition: service_started
      dagster-postgres:
        condition: service_healthy

  dagster-daemon:
    <<: *dagster-common
    container_name: dagster-daemon
    command: ["dagster-daemon", "run"]
    volumes:
      - ./dagster_project:/opt/dagster/app/dagster_project
      - ./datasets:/opt/dagster/app/datasets
    depends_on:
      dagster-user-code:
        condition: service_started
      dagster-postgres:
        condition: service_healthy

volumes:
  mongodb_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  clickhouse_data:
  clickhouse_logs:
  dagster_pg_data:

networks:
  data-plane-network:
    driver: bridge
